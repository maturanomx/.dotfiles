#: Floating quick-note panel (kitten quick-access-terminal), launched by _scripts/quick-note

#: Dock to the right edge, full-height; 81 columns ≈ 1/3 of a 1512pt screen
edge right
lines 30
columns 81

background_opacity 1.0
hide_on_focus_loss yes

#: Full border in the aerospace/borders active green (catppuccin mocha).
#: Without minimal_borders + margin only the top/bottom edges render.
kitty_override active_border_color=#a6e3a1
kitty_override inactive_border_color=#585b70
kitty_override draw_minimal_borders=no
kitty_override draw_window_borders_for_single_window=yes
kitty_override window_border_width=4pt
kitty_override window_margin_width=3
kitty_override window_padding_width=6
