# Only deviations from defaults. Reference: https://sw.kovidgoyal.net/kitty/conf/

include theme-catppuccin-mocha.conf

bold_font        Victor Mono Bold
bold_italic_font Victor Mono Bold Italic
font_family      Victor Mono SemiBold
italic_font      Victor Mono SemiBold Italic
symbol_map U+e000-U+f8ff,U+f0000-U+ffffd,U+100000-U+10fffd Symbols Nerd Font Mono

#: Appearance
background_blur 12
background_opacity 0.97
hide_window_decorations titlebar-only
tab_bar_edge top
tab_bar_margin_height 1.5 1.5
tab_bar_margin_width 3.0
tab_bar_style powerline
tab_powerline_style round

#: Behavior
allow_remote_control yes
auto_reload_config 0.5
# splits first so it is the startup layout, as the split bindings below need it
enabled_layouts splits,stack
copy_on_select clipboard
macos_quit_when_last_window_closed yes
mouse_map middle release ungrabbed paste_from_clipboard

map --allow-fallback=shifted,ascii cmd+t new_tab_with_cwd
map --allow-fallback=shifted,ascii kitty_mod+t new_tab_with_cwd
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+tab previous_tab
map ctrl+space>- launch --location=hsplit --cwd=current
map ctrl+space>\ launch --location=vsplit --cwd=current
map ctrl+space>h neighboring_window left
map ctrl+space>j neighboring_window bottom
map ctrl+space>k neighboring_window top
map ctrl+space>l neighboring_window right
map ctrl+space>q close_window
map ctrl+tab next_tab
